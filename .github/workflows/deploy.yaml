name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install dependencies
        run: npm install # uses npm instead of pnpm because it does not work with the deplyment action

      - name: Install Rust and wasm-pack
        run: |
          rustup update stable
          rustup target add wasm32-unknown-unknown
          cargo install -f wasm-pack

      - name: Build WebAssembly Package
        run: npm run build:wasm

      - name: Build project
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          clean: true
