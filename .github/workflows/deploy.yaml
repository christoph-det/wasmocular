name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          path: emsdk

      - name: Add wasm32-unknown-emscripten target
        run: rustup target add wasm32-unknown-emscripten

      - name: Build wasm-gix module
        shell: bash
        env:
          CARGO_TARGET_WASM32_UNKNOWN_EMSCRIPTEN_LINKER: ${{ env.EMSDK }}/upstream/emscripten/emcc
          CARGO_TARGET_WASM32_UNKNOWN_EMSCRIPTEN_AR: ${{ env.EMSDK }}/upstream/emscripten/emar
        run: |
          source $EMSDK/emsdk_env.sh
          pnpm run build:wasm-gix

      - name: Build project
        run: pnpm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          clean: true
