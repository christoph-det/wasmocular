name: CI

on:
  push:
    branches:
      - main

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: npm install -g pnpm && pnpm install

      - name: Install Rust
        uses: dtolnay/rust-action@stable

      - name: Run ESLint
        run: pnpm eslint --version && pnpm run lint

      - name: Run TypeScript type checking
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm run test

      - name: Run Rust tests
        run: cargo test --manifest-path crates/wasm-gix/Cargo.toml
