[target.wasm32-unknown-emscripten]
linker = "../emsdk/upstream/emscripten/emcc"
ar = "../emsdk/upstream/emscripten/emar"
rustflags = [
    #  PROFILING FLAGS
    # "-C", "debuginfo=1",
    # "-C", "link-arg=--profiling",

    "-C",
    "link-arg=-sEXPORT_ALL=1",
    "-C",
    "link-arg=-sEXPORTED_RUNTIME_METHODS=[\"ccall\",\"UTF8ToString\",\"stringToUTF8\",\"lengthBytesUTF8\",\"FS\" ,\"IDBFS\"]",
    "-C",
    "link-arg=-sMODULARIZE=1",
    "-C",
    "link-arg=-sEXPORT_ES6=1",
    "-C",
    "link-arg=-sEXPORT_NAME=createGitoxideModule",
    "-C",
    "link-arg=-sFORCE_FILESYSTEM=1",
    "-C",
    "link-arg=-sALLOW_MEMORY_GROWTH=1",
    "-C",
    "link-arg=-sINITIAL_MEMORY=134217728",
    "-C",
    "link-arg=--sSTACK_SIZE=2097152",
    "-C",
    "link-arg=-sMALLOC=emmalloc",
    "-C",
    "link-arg=-lidbfs.js",
    "-C",
    "link-arg=--no-entry",
]
